<!DOCTYPE html>
<html>
<head>
    <title>Ako si Greg</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

   
    <div id="startScreen">
        <h1 class="menutitle">greg memories</h1>
        <div class="menu-buttons">
            <button class="menu-btn" onclick="startGame()">Start </button>
            <button class="menu-btn" onclick="exitGame()">Exit</button>
        </div>
    </div>

  
    <div id="puzzleScreen" style="display: none;">
        <h3 id="puzzleTitle">AKO SI GREG</h3>
        <p>HANAPIN MO AKO</p>

        <div class="puzzle-container">
            <div class="card" onclick="selectCard(this, 'gregA')">
                <img src="greg.jpg" class="card-img" alt="Greg">
            </div>
            <div class="card" onclick="selectCard(this, 'gregB')">
                <img src="greg2.jpg" class="card-img" alt="Greg 2">
            </div>
            <div class="card" onclick="selectCard(this, 'gregC')">
                <img src="greg.jpg" class="card-img" alt="Greg 3">
            </div>
            <div class="card" onclick="selectCard(this, 'gregA')">
                <img src="greg.jpg" class="card-img" alt="Greg">
            </div>
            <div class="card" onclick="selectCard(this, 'gregB')">
                <img src="greg2.jpg" class="card-img" alt="Greg 2">
            </div>
            <div class="card" onclick="selectCard(this, 'gregC')">
                <img src="greg.jpg" class="card-img" alt="Greg 3">
            </div>
        </div>
        <p id="puzzleMsg" style="font-weight: bold;"></p>
    </div>

    
    <div id="partyScreen" style="display: none;">
        <h1 id="mainTitle">NAHANAP MOKO!!</h1>
        <p id="mainText"></p>
        
        <button id="gregButton" onclick="showGreg()">Click if you miss Greg</button>
        
        <img id="greg2Img" src="greg2.jpg" alt="Greg 2">

        <div class="picture-area">
            <video id="gregPic" width="500" autoplay muted loop playsinline>
                <source src="vid1.mp4" type="video/mp4">
                Your browser does not support the video tag.
            </video>
        </div>

        <audio id="gregMusic" src="sound1.mp3" preload="auto" loop></audio>
        
    </div>

    <script src="jas.js"></script>
</body>
</html>
